# coturn configuration for NOVA voice/video calls.
# setup-turn.sh fills in the values between <angle brackets>; you can also edit them by hand
# and copy this file to /etc/turnserver.conf.

# Ports: 3478 for TURN over UDP/TCP. Open them in the VPS firewall / cloud security group.
listening-port=3478

# Public IP of the VPS. If the VPS sits behind NAT (e.g. some cloud providers), use
# external-ip=<PUBLIC_IP>/<PRIVATE_IP>
external-ip=<PUBLIC_IP>

# UDP port range used to relay media. Must also be open in the firewall.
min-port=49152
max-port=65535

# Time-limited credentials signed by the NOVA backend (NOVA_WEBRTC_TURN_SECRET).
# Must be exactly the same value as NOVA_WEBRTC_TURN_SECRET in the backend .env.
use-auth-secret
static-auth-secret=<TURN_SECRET>
realm=<REALM>

fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Do not let clients use the server to reach private networks on the VPS side.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Limits: enough for 1:1 calls, protects the VPS bandwidth.
total-quota=200
user-quota=12
stale-nonce=600

log-file=/var/log/turnserver.log
simple-log
